<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声と叩き方で MIDI を編集（確認用）</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
      fieldset { border: 1px solid #8884; border-radius: 8px; margin: 16px 0; padding: 12px 16px; }
      legend { font-weight: bold; }
      button { margin: 4px 8px 4px 0; padding: 6px 14px; }
      table { border-collapse: collapse; width: 100%; }
      td { border-bottom: 1px solid #8883; padding: 4px 8px; vertical-align: top; }
      td:first-child { opacity: 0.7; width: 40%; }
      .note { opacity: 0.7; font-size: 0.9em; }
      .tap-pad { border: 2px dashed #8886; border-radius: 12px; padding: 32px 16px; text-align: center; user-select: none; cursor: pointer; margin-bottom: 8px; }
      .tap-pad.hit { background: #8883; }
    </style>
  </head>
  <body>
    <h1>声と叩き方で MIDI を編集（確認用）</h1>
    <p class="note">開発用のページです（本番の画面には出ません）。声はブラウザの中だけで使い、保存・送信しません。編集の順番は 声（移調・音域）→ 叩き方（テンポ・ノリ・ドラム・揺らぎ）。</p>

    <fieldset>
      <legend>1. 原曲の MIDI</legend>
      <input type="file" id="midiFile" accept=".mid,.midi,audio/midi" />
      <button id="useSample">仮の原曲を使う（D dorian・8小節）</button>
      <div>原曲のキー（分かれば）:
        <select id="songRoot"><option value="">自動（MIDI から読む・推定）</option></select>
        <select id="songScale"></select>
      </div>
      <div id="midiInfo" class="note">まだ読み込んでいません</div>
    </fieldset>

    <fieldset>
      <legend>2. 声の WAV</legend>
      <input type="file" id="wavFile" accept=".wav,audio/wav,audio/*" />
      <button id="noVoice">声なしで試す</button>
    </fieldset>

    <fieldset>
      <legend>3. 叩いたリズム</legend>
      <div id="tapPad" class="tap-pad">ここを好きなリズムで叩く（クリック／タップ）</div>
      <div>
        <button id="tapReset">叩き直す</button>
        <button data-sample="steady">見本: 安定・ゆっくり</button>
        <button data-sample="rush">見本: 速い・だんだん速く</button>
        <button data-sample="loose">見本: バラバラ</button>
        <button id="noTaps">叩かないで試す</button>
      </div>
      <div id="tapInfo" class="note">まだ叩いていません（叩かなければ、原曲のテンポ・リズムのまま）</div>
    </fieldset>

    <fieldset>
      <legend>4. 結果</legend>
      <table id="result"><tr><td colspan="2" class="note">1 と 2 を選ぶと表示されます</td></tr></table>
      <div>
        <button id="playOriginal" disabled>原曲を鳴らす</button>
        <button id="playEdited" disabled>編集後を鳴らす</button>
        <button id="stop">止める</button>
        <button id="download" disabled>編集後の MIDI を保存</button>
      </div>
    </fieldset>

    <script type="module" src="./voice-edit.js"></script>
  </body>
</html>
