<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瞬きのテスト（開発用）</title>
    <style>
      :root { color-scheme: light dark; --line: #8884; --accent: #e8457a; }
      body { margin: 0; font-family: system-ui, "Hiragino Sans", sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-size: 1rem; }
      button.primary { background: var(--accent); color: #fff; border: none; }
      button:disabled { opacity: 0.4; cursor: default; }
      video { width: 240px; border-radius: 8px; transform: scaleX(-1); background: #0002; }
      .meter { position: relative; height: 18px; width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: 4px; }
      .meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; }
      .meter .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: currentColor; opacity: 0.6; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
      .stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
      .stats b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
      .flash { outline: 4px solid var(--accent); }
      label { display: inline-flex; gap: 6px; align-items: center; }
      canvas { width: 100%; height: 36px; display: block; }
      table { border-collapse: collapse; width: 100%; }
      td, th { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: middle; }
      small { opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>瞬きのテスト（開発用）</h1>
      <p><small>カメラの映像は保存も送信もしません。使うのは瞬きの時刻だけです。数字を性格や気持ちの判定には使いません。</small></p>

      <div class="row">
        <button id="start" class="primary">カメラを始める</button>
        <button id="measure" disabled>60秒はかる</button>
        <button id="stop" disabled>止める</button>
        <label>名前（比べる用、この画面だけ）<input id="label" size="8" placeholder="A" /></label>
        <label><input id="sound" type="checkbox" checked />瞬きで音を鳴らす</label>
      </div>
      <p id="status"><small>「カメラを始める」を押してください（初回はモデルの読み込みに数秒かかります）</small></p>

      <div class="row">
        <video id="video" muted playsinline></video>
        <div style="flex: 1; display: grid; gap: 8px; min-width: 260px">
          <div>目の閉じ具合 <small id="scoreText">-</small></div>
          <div class="meter"><div class="fill" id="fill"></div><div class="mark" id="markClose"></div><div class="mark" id="markOpen"></div></div>
          <label>閉じた（これより上）<input id="closeAbove" type="range" min="0.2" max="0.9" step="0.05" /><span id="closeText"></span></label>
          <label>開いた（これより下）<input id="openBelow" type="range" min="0.05" max="0.6" step="0.05" /><span id="openText"></span></label>
        </div>
      </div>

      <div class="stats">
        <div>顔<b id="face">-</b></div>
        <div>瞬き（始めてから）<b id="count">0</b></div>
        <div>1分あたり<b id="rate">-</b></div>
        <div>はかる残り<b id="left">-</b></div>
        <div>処理の速さ（コマ/秒）<b id="fps">-</b><small>20 より少ないと短い瞬きを見逃す</small></div>
      </div>

      <h2>60秒の記録（比べる用）</h2>
      <table>
        <thead><tr><th>名前</th><th>回数</th><th>1分あたり</th><th style="width: 50%">リズム（横が60秒）</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
      <details><summary>記録の数字（JSON）</summary><pre id="json">[]</pre></details>
    </main>
    <script type="module" src="./blink.js"></script>
  </body>
</html>
